# TUM global_racetrajectory_optimization parameters for the REAL F1TENTH car (Traxxas Slash 4x4), mintime only.
# racecar.ini is the AutoDRIVE sim car; this is its counterpart for the car: build_raceline <name> --config
# $(ros2 pkg prefix planning)/share/planning/config/racecar_car.ini. Read by planning/tum_mintime.py. Values are JSON.
#
# START VALUES, NOT MEASURED: the geometry and mass are f1tenth_gym's defaults [gym]; the limits are conservative
# guesses for an indoor floor [est]. Measure the car (control sysid_recorder_node + fit_vehicle, with car.launch.py),
# keep control/config/vehicle_car.yaml and this file in step (test_vehicle_params.py), and raise mue and the
# safe_traj limits from lap_logger_node's laps. The tire curve and NLP scaling are racecar.ini's, which converged on
# the sim tracks; with these values the optimizer has not been run yet.
#
# Sources:
#   [gym]   f1tenth_gym default vehicle parameters (real F1TENTH car)
#   [est]   estimate, measure on the car
# ----------------------------------------------------------------------------------------------------------------------
[GENERAL_OPTIONS]

### stepsize options [m]
# stepsize_prep:               linear interpolation before spline approximation
# stepsize_reg:                spline interpolation after spline approximation (= discretization of the optimization)
# stepsize_interp_after_opt:   spline interpolation of the exported raceline

stepsize_opts={"stepsize_prep": 0.05,
               "stepsize_reg": 0.2,
               "stepsize_interp_after_opt": 0.1}

### spline regression smooth options
# k_reg:                        [-] order of B-Splines
# s_reg:                        [-] smoothing factor (scipy splprep s; sum of squared residuals in m^2 over the
#                               stepsize_prep points: 1.0 on a ~30 m track ~ 4 cm rms deviation)

reg_smooth_opts={"k_reg": 3,
                 "s_reg": 1.0}

### preview and review distances for numerical curvature calculation [m] (scaled from TUM's 2.0/1.0 for a 1/10 car)

curv_calc_opts = {"d_preview_curv": 0.4,
                  "d_review_curv": 0.4,
                  "d_preview_head": 0.2,
                  "d_review_head": 0.2}

### general vehicle parameters
# v_max:        [m/s] [est] cap for the first runs; raise it with the car's measured top speed
# length:       [m] 0.58 [gym]
# width:        [m] 0.31 [gym]
# mass:         [kg] 3.74 [gym]
# dragcoeff:    [kg*m2/m3] 0.5 * rho_air * c_w * A = 0.5 * 1.225 * 0.6 * 0.04 [est]
# curvlim:      [rad/m] tan(0.4189) / 0.3302 (vehicle_car.yaml; not used by mintime, kept for TUM's checks)
# g:            [N/kg]

veh_params = {"v_max": 6.0,
              "length": 0.58,
              "width": 0.31,
              "mass": 3.74,
              "dragcoeff": 0.015,
              "curvlim": 1.35,
              "g": 9.81}

vel_calc_opts = {"dyn_model_exp": 1.0,
                 "vel_profile_conv_filt_window": null}

# ----------------------------------------------------------------------------------------------------------------------
[OPTIMIZATION_OPTIONS]

### minimum lap time optimization options
# width_opt:       [m] vehicle width incl. safety margin: 0.31 car [gym] + 2 x 0.115 m (as racecar.ini). Size it
#                  from the car's measured lateral and localization error (lap_logger_node).
# penalty_delta:   [-] smoothness penalty on steering changes (TUM default 10)
# penalty_F:       [-] smoothness penalty on force changes (TUM default 0.01). 1.0: at 0.01 the speed plan
#                  switched straight from full drive to full brake (sim: "slamming gas and brake")
# mue:             [-] friction coefficient [est]: 0.6, conservative for an indoor floor (f1tenth_gym uses 1.0489);
#                  raise it from the laps
# safe_traj:       acceleration ellipse (ax / ax_safe)^2 + (ay / ay_safe)^2 <= 1 at every point. Explicit values
#                  need no ggv diagram (only nulls are filled from one). Without it Porto planned ax -5.6 .. +6.2
#                  m/s^2, faster than the adapter's speed ramp (max_acceleration 2.5 m/s^2) can follow.
#   ax_pos_safe:   [m/s^2] = the car's speed ramp (f1tenth_system's throttle_interpolator / acceleration limit)
#   ax_neg_safe:   [m/s^2] braking [est], < mue * g
#   ay_safe:       [m/s^2] lateral [est], < mue * g
# scaling:         our patch to opt_mintime.py (docker/tum_mintime.patch). Upstream hard-codes NLP scaling for a
#                  1200 kg car (v 50 m/s, forces 7500-20000 N, n 5 m) and caps the yaw rate at pi/2 rad/s, which a
#                  1/10 car exceeds in every corner (v / R ~ 3 m/s / 0.8 m). Values ~ the expected magnitudes:
#   v_s, omega_z_s, n_s, f_drive_s, f_brake_s, gamma_y_s:  state / control scaling [m/s, rad/s, m, N, N, N]
#   omega_z_max:   [rad/s] yaw rate bound
#   v_guess:       [m/s] initial guess for the speed
#   f_prod_max:    [N^2] tolerance of the f_drive * f_brake = 0 constraint (upstream 20000 N^2)
#   f_reg_s:       [N] force normalization in the penalty_F term (upstream 10000 N)

optim_opts_mintime={"width_opt": 0.54,
                    "penalty_delta": 10.0,
                    "penalty_F": 1.0,
                    "mue": 0.6,
                    "n_gauss": 5,
                    "dn": 0.25,
                    "limit_energy": false,
                    "energy_limit": 2.0,
                    "safe_traj": true,
                    "ax_pos_safe": 2.5,
                    "ax_neg_safe": -3.0,
                    "ay_safe": 5.5,
                    "w_tr_reopt": 2.0,
                    "w_veh_reopt": 1.6,
                    "w_add_spl_regr": 0.2,
                    "step_non_reg": 0,
                    "eps_kappa": 1e-3,
                    "scaling": {"v_s": 10.0,
                                "omega_z_s": 5.0,
                                "n_s": 0.5,
                                "f_drive_s": 30.0,
                                "f_brake_s": 30.0,
                                "gamma_y_s": 10.0,
                                "omega_z_max": 15.0,
                                "v_guess": 3.0,
                                "f_prod_max": 1.0,
                                "f_reg_s": 30.0}}

### vehicle parameters (minimum lap time optimization)
# wheelbase_front:     [m] CoG -> front axle, lf 0.15875 [gym]
# wheelbase_rear:      [m] CoG -> rear axle, lr 0.17145 [gym]
# track_width_*:       [m] 0.25 [est]
# cog_z:               [m] 0.074 [gym]
# I_z:                 [kgm^2] 0.04712 [gym]
# liftcoeff_*:         [kg*m2/m3] no aero devices
# k_brake_front:       [-] 0.5 [est]
# k_drive_front:       [-] 0.5, all-wheel drive, even split [est]
# k_roll:              [-] 0.5 [est]
# t_delta:             [s] delta_max / steering rate = 0.4189 / 3.2 rad/s [gym]
# t_drive, t_brake:    [s] 0.05 [est]
# power_max:           [W] 500 [est]; traction limits acceleration below ~18 m/s anyway (mue * m * g ~ 27 N)
# f_drive_max:         [N] 40 [est], above the traction limit
# f_brake_max:         [N] 40 [est], above the traction limit
# delta_max:           [rad] 0.4189 [gym], = vehicle_car.yaml max_steering_angle

vehicle_params_mintime = {"wheelbase_front": 0.15875,
